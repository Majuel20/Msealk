name: Actualizar cortes programados

on:
  workflow_dispatch:
    inputs:
      permitir_vacio:
        description: "Permitir cero cortes tras comprobar manualmente la fuente SEAL"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 10 * * *" # 05:17 de PerÃº; GitHub puede retrasar la ejecuciÃ³n.

permissions:
  contents: write

concurrency:
  group: actualizar-cortes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Lima
      PYTHONUNBUFFERED: "1"
      PERMITIR_VACIO: ${{ inputs.permitir_vacio || false }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: actualizador/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install -r actualizador/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Probar validaciÃ³n y protecciÃ³n de datos
        run: python -m unittest discover -s actualizador -p 'test_*.py' -v
      - name: Extraer y validar antes de publicar
        shell: bash
        run: |
          opciones=()
          if [[ "$PERMITIR_VACIO" == "true" ]]; then
            opciones+=(--permitir-vacio)
          fi
          python actualizador/publicar_datos.py "${opciones[@]}"
      - name: Guardar los datos en la rama de ejecuciÃ³n
        env:
          RAMA: ${{ github.ref_name }}
        run: |
          git config user.name "msealk-bot"
          git config user.email "msealk-bot@users.noreply.github.com"
          git add datos/cortes_programados.*
          if git diff --cached --quiet; then
            echo "Los datos no cambiaron."
            exit 0
          fi
          git commit -m "Actualizar cortes programados de SEAL"
          git pull --rebase origin "$RAMA"
          git push origin "HEAD:$RAMA"
